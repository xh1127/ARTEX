name: test

on:
  push:
    branches: ["main", "handoff/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-test:
    name: Go vet + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The db/agent/server/evidence TestMains take PostgreSQL advisory lock
      # 7337741002 to serialize cross-package cleanup, and they DELETE rows.
      # The service below is throwaway, so pointing at it is safe by construction.
      ARTEX_PG_DSN: postgres://artex:artex@127.0.0.1:5432/artex_test?sslmode=disable
    services:
      postgres:
        # Matches docker-compose.yml and install.sh.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex
          POSTGRES_DB: artex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Tests create the schema themselves (db.Open re-runs schema.sql on every
      # start), so there is no migration step to run here.
      - name: go vet
        run: go vet ./...

      # Blocking: the failures that used to make this informational have been
      # fixed (profile-cleanup ordering in the chat tests, Windows-only evidence
      # fsync, skillRelPath separator normalization, llmrec table bootstrap).
      # Note the first Linux run is itself the verification — this suite was
      # developed on Windows, so treat an unexpected failure there as a real
      # signal rather than noise.
      - name: go test
        # -count=1 defeats the result cache so a re-run always exercises the DB.
        run: go test -count=1 ./...

  frontend:
    name: Frontend typecheck + lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: tsc
        run: npx tsc --noEmit
        working-directory: web
      # Use the project's own script (biome check) so the include/exclude rules
      # in biome.json stay authoritative — passing an explicit path here would
      # override them.
      #
      # Non-blocking: the repository already has 135 errors / 138 warnings at
      # 88b2c18, none of them in the files this branch touched. gating on it
      # would paint CI red for pre-existing debt and train people to ignore it.
      # Remove continue-on-error once that backlog is cleared.
      - name: biome check
        run: npm run check
        working-directory: web
        continue-on-error: true
